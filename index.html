<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>PBB Collab 3.0 Big 4 Ranker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="description" content="Rank your Kapamilya and Kapuso Big 4 for Pinoy Big Brother Collab 3.0." />
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" type="text/css" media="screen" href="styles.css?v=3.0.21" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="top-banner">
    <p id="version">v3.0.21</p>
    <img id="banner-image" src="assets/logo_pbb.png" alt="Pinoy Big Brother Collab 3.0" />
    <p id="banner-title">WHO WINS... YOU DECIDE!</p>
    <p id="banner-subtitle">Who are your KAPAMILYA and KAPUSO BIG 4?</p>
  </div>

  <div class="flex-container padded-box">
    <div>
      <div id="table">
        <div id="table__filter-container">
          <input id="table__filter-input" oninput="filterHousemates(event)" type="text" placeholder="Search Housemate/s" aria-label="Search housemates" />
        </div>

        <div id="status-filters" class="filter-chips" role="group" aria-label="Housemate filters">
          <button type="button" class="filter-chip is-active" data-filter="all" onclick="setStatusFilter('all', this)">All</button>
          <button type="button" class="filter-chip chip-kapamilya" data-filter="kapamilya" onclick="setStatusFilter('kapamilya', this)">Kapamilya Housemates</button>
          <button type="button" class="filter-chip chip-kapuso" data-filter="kapuso" onclick="setStatusFilter('kapuso', this)">Kapuso Housemates</button>
          <button type="button" class="filter-chip chip-nominated" data-filter="nominated" onclick="setStatusFilter('nominated', this)">Nominated</button>
          <button type="button" class="filter-chip chip-evicted" data-filter="evicted" onclick="setStatusFilter('evicted', this)">Evicted</button>
          <button type="button" class="filter-chip chip-immunity" data-filter="immunity" onclick="setStatusFilter('immunity', this)">With Immunity</button>
          <button type="button" class="filter-chip chip-safe" data-filter="safe" onclick="setStatusFilter('safe', this)">Safe</button>
        </div>

        <div id="table__entry-container"></div>
      </div>

      <div id="sharelink-container">
        <input type="button" id="getlink-button" value="Get link" onclick="generateShareLink()" />
        <input type="text" placeholder="http://" id="getlink-textbox" readonly />
        <input type="button" id="copylink-button" value="Copy" onclick="copyLink()" />
      </div>
      <div id="saveimage-container">
        <input type="button" id="saveimage-button" value="Save Big 4 Image" onclick="saveBig4Image()" />
        <p id="saveimage-hint">Preview your Kapamilya + Kapuso Big 4 photo, then download</p>
      </div>
    </div>

    <div id="parent-ranking">
      <div id="ranking__pyramid" class="ranking__pyramid pyramid-kapamilya">
        <div id="ranking__title" class="ranking__title"><strong>KAPAMILYA BIG 4</strong></div>
        <div class="ranking__row"></div>
        <div class="ranking__row"></div>
        <div class="ranking__row"></div>
        <div class="ranking__row"></div>
      </div>
      <div id="ranking__pyramid2" class="ranking__pyramid pyramid-kapuso">
        <div id="ranking__title" class="ranking__title"><strong>KAPUSO BIG 4</strong></div>
        <div class="ranking__row"></div>
        <div class="ranking__row"></div>
        <div class="ranking__row"></div>
        <div class="ranking__row"></div>
      </div>
    </div>
  </div>

  <div id="export-preview-modal" class="export-modal" hidden aria-hidden="true">
    <div class="export-modal__backdrop" onclick="closeExportPreview()"></div>
    <div class="export-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="export-preview-title">
      <div class="export-modal__header">
        <h2 id="export-preview-title">THIS IS YOUR KAPAMILYA AND KAPUSO BIG 4:</h2>
        <button type="button" id="export-preview-close" class="export-modal__close" onclick="closeExportPreview()" aria-label="Close preview">×</button>
      </div>
      <div class="export-modal__body">
        <img id="export-preview-image" alt="Generated Kapamilya and Kapuso Big 4 preview" />
      </div>
      <div class="export-modal__actions">
        <button type="button" id="export-preview-cancel" onclick="closeExportPreview()">Close</button>
        <button type="button" id="export-preview-download" onclick="downloadExportPreview()">Download</button>
      </div>
    </div>
  </div>

  <div id="nominated-float" class="nominated-float" hidden aria-hidden="true" onclick="closeNominatedFloat()">
    <div class="nominated-float__backdrop" aria-hidden="true"></div>
    <div
      class="nominated-float__content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="nominated-float-kapamilya-title nominated-float-kapuso-title"
      onclick="event.stopPropagation()"
    >
      <button
        type="button"
        id="nominated-float-close"
        class="nominated-float__close"
        onclick="closeNominatedFloat()"
        aria-label="Close nominated housemates"
      >×</button>
      <section class="nominated-float__section" aria-labelledby="nominated-float-kapamilya-title">
        <h2 id="nominated-float-kapamilya-title" class="nominated-float__title nominated-float__title--kapamilya">NOMINATED KAPAMILYA HOUSEMATES</h2>
        <div id="nominated-float-kapamilya" class="nominated-float__cards"></div>
      </section>
      <section class="nominated-float__section" aria-labelledby="nominated-float-kapuso-title">
        <h2 id="nominated-float-kapuso-title" class="nominated-float__title nominated-float__title--kapuso">NOMINATED KAPUSO HOUSEMATES</h2>
        <div id="nominated-float-kapuso" class="nominated-float__cards"></div>
      </section>
    </div>
  </div>

  <div id="visitor-badge" class="visitor-badge" hidden aria-hidden="true" aria-live="polite">
    You’re the <span class="visitor-number">#<span id="visitor-count">0</span></span> visitor.
  </div>

  <script src="scripts/csv.js?v=3.0.21"></script>
  <script src="scripts/dragdrop.js?v=3.0.21"></script>
  <script src="scripts/housematesort.js?v=3.0.21"></script>
  <script src="scripts/main.js?v=3.0.21"></script>
  <script src="scripts/exportimage.js?v=3.0.21"></script>
  <script src="scripts/nominatedfloat.js?v=3.0.21"></script>
  <script src="scripts/visitor.js?v=3.0.21"></script>
</body>
</html>
